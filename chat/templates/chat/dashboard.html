{% extends 'base.html' %}
{% block content %}
  <h1 class="text-2xl font-bold mb-4">Operator Dashboard</h1>

  <div class="mb-4">
    <select id="session-select" class="border p-2 rounded min-w-48"></select>
  </div>

  <p id="session-status" class="font-semibold mb-2 text-yellow-600">This session is being handled by the Bot.</p>

  <div id="chat-box" class="border p-4 h-64 overflow-y-scroll mb-4 bg-white rounded shadow"></div>

  <div class="border p-4 bg-gray-50 rounded shadow mb-4">
    <h2 class="font-semibold text-lg mb-2">Order History</h2>
    <pre id="order-history" class="whitespace-pre-wrap text-sm text-gray-700"></pre>
  </div>

  <form id="reply-form">
    <textarea id="reply" rows="2" class="w-full p-2 border rounded" placeholder="Type human response..."></textarea>
    <button class="mt-2 px-4 py-2 bg-blue-600 text-white rounded">Send</button>
  </form>

  <script>
    const STORAGE_KEY = 'trinitychat_sessions';
    const sessionSelect = document.getElementById('session-select');
    const sessionStatus = document.getElementById('session-status');
    const chatBox = document.getElementById('chat-box');
    const orderHistory = document.getElementById('order-history');
    const replyForm = document.getElementById('reply-form');
    const replyInput = document.getElementById('reply');

    function loadSessions() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (error) {
        return {};
      }
    }

    function saveSession(session) {
      const sessions = loadSessions();
      session.updatedAt = new Date().toISOString();
      sessions[session.id] = session;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    }

    function sortedSessions() {
      return Object.values(loadSessions()).sort((a, b) => {
        return new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt);
      });
    }

    function selectedSessionId() {
      return sessionSelect.value || new URLSearchParams(window.location.search).get('session');
    }

    function setStatus(session) {
      sessionStatus.textContent = session.isHuman
        ? 'This session is currently in Human Mode.'
        : 'This session is being handled by the Bot.';
      sessionStatus.className = session.isHuman
        ? 'font-semibold mb-2 text-green-600'
        : 'font-semibold mb-2 text-yellow-600';
    }

    function renderMessage(message) {
      const row = document.createElement('p');
      const label = document.createElement('strong');
      label.className = 'capitalize';
      label.textContent = `${message.sender}: `;
      row.appendChild(label);
      row.appendChild(document.createTextNode(message.message));
      chatBox.appendChild(row);
    }

    function renderSessionSelect(currentId) {
      const sessions = sortedSessions();
      sessionSelect.innerHTML = '';

      if (sessions.length === 0) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'No sessions yet';
        sessionSelect.appendChild(option);
        return null;
      }

      const activeId = currentId && sessions.some(session => session.id === currentId)
        ? currentId
        : sessions[0].id;

      sessions.forEach((session, index) => {
        const option = document.createElement('option');
        option.value = session.id;
        option.textContent = `Session ${index + 1}`;
        option.selected = session.id === activeId;
        sessionSelect.appendChild(option);
      });

      return activeId;
    }

    function renderDashboard() {
      const activeId = renderSessionSelect(selectedSessionId());
      const sessions = loadSessions();
      const session = activeId ? sessions[activeId] : null;

      chatBox.innerHTML = '';
      if (!session) {
        setStatus({ isHuman: false });
        chatBox.textContent = 'No chat sessions yet.';
        orderHistory.textContent = 'No order history available for this session.';
        return;
      }

      session.messages.forEach(renderMessage);
      setStatus(session);
      orderHistory.textContent = session.orderHistory || 'No order history available for this session.';
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sessionSelect.addEventListener('change', () => {
      const url = new URL(window.location.href);
      if (sessionSelect.value) {
        url.searchParams.set('session', sessionSelect.value);
      } else {
        url.searchParams.delete('session');
      }
      window.history.replaceState({}, '', url);
      renderDashboard();
    });

    replyForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const message = replyInput.value.trim();
      const sessions = loadSessions();
      const session = sessions[selectedSessionId()];

      if (!session || !message) {
        return;
      }

      session.isHuman = true;
      session.messages.push({
        sender: 'human',
        message,
        timestamp: new Date().toISOString()
      });
      saveSession(session);
      replyInput.value = '';
      renderDashboard();
    });

    window.addEventListener('storage', renderDashboard);
    window.addEventListener('DOMContentLoaded', renderDashboard);
    setInterval(renderDashboard, 1000);
  </script>
{% endblock %}
